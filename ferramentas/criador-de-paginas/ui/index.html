<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AECA — Criador de páginas</title><link rel="stylesheet" href="style.css"></head>
<body><main class="shell"><header><p class="eyebrow">AECA · FERRAMENTA LOCAL</p><h1>Criar página HTML</h1><p>Gere uma nova página no padrão do site sem editar arquivos existentes.</p></header><div id="notice" role="status" aria-live="polite"></div><form id="page-form" novalidate><label class="field"><span>Modelo</span><select id="template" required></select><small id="template-description"></small></label><div class="grid"><label class="field"><span>Título</span><input id="title" name="title" required maxlength="120" autocomplete="off"></label><label class="field"><span>Slug / nome do arquivo</span><input id="slug" autocomplete="off" required pattern="[a-z0-9]+(?:-[a-z0-9]+)*"><small>Gerado pelo título; pode ser editado.</small></label></div><label class="field"><span>Pasta de destino</span><div class="inline"><input id="directory" autocomplete="off" required><button type="button" class="secondary" id="browse-directory">Escolher…</button></div><small>Relativa à raiz do site. A página ficará em <strong id="path-preview"></strong></small></label><section id="dynamic-fields" class="dynamic-fields"></section><aside class="notice-info"><strong>Registros do site:</strong> novas páginas não são inseridas automaticamente na home, no índice de espetáculos ou no sitemap. Atualize as listagens pertinentes manualmente após revisar o HTML.</aside><div class="actions"><button type="submit" id="create-button">Gerar e abrir página</button></div></form></main><script src="app.js"></script></body>
</html>
