<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta http-equiv="x-ua-compatible" content="ie=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{title}}</title>
	<meta name="description" content="{{description}}">
	<meta name="robots" content="index,follow,max-image-preview:large">
	<link rel="canonical" href="{{canonicalUrl}}">
	<meta property="og:locale" content="pt_BR">
	<meta property="og:type" content="website">
	<meta property="og:url" content="{{canonicalUrl}}">
	<meta property="og:title" content="{{title}}">
	<meta property="og:site_name" content="A.E.C.A">
	<meta property="og:description" content="{{description}}">
	<meta property="og:image" content="{{socialImageUrl}}">
	<meta name="twitter:card" content="summary_large_image">
	<meta name="twitter:url" content="{{canonicalUrl}}">
	<meta name="twitter:title" content="{{title}}">
	<meta name="twitter:description" content="{{description}}">
	<meta name="twitter:image" content="{{socialImageUrl}}">
	<link rel="icon" href="/css/logos/favicon.webp" type="image/x-icon">
	<link rel="stylesheet" type="text/css" href="/css/styles/style.css">
	<script type="application/ld+json">{{jsonLd}}</script>
</head>
<body>
	<div id="cabecalho"></div>
	<div class="container">
		<main class="main-content">
			<h1>{{title}}</h1>
			<h2 class="page-subtitle">{{subtitle}}</h2>
			<hr>
			<section class="galeria-intro" aria-label="Introdução da galeria"><p>{{intro}}</p></section>
			{{groupsHtml}}
		</main>
		<div id="imageModal" class="image-modal"><span class="close-modal">&times;</span><img id="modalImage" class="modal-content" alt="Imagem ampliada da galeria"></div>
	</div>
	<div id="footer"></div>
	<script src="/js/app.js" defer></script>
</body>
</html>
